<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Penawaran Properti | PT Jade Karya Trinusa</title>
  
  <link rel="icon" type="image/png" href="icon.png">

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Kalkulator Penawaran Properti | PT Jade Karya Trinusa">
  <meta property="og:description" content="Aplikasi perhitungan estimasi nilai penawaran properti dan nilai pasar.">
  <meta property="og:image" content="kalkulator-penawaran.jpg">

  <style>
    /* ================= MAROON CORPORATE THEME ================= */
    :root {
      --maroon-primary: #800000;
      --maroon-dark: #5a0000;
      --maroon-hover: #990000;
      --bg-light: #f5f2f2;
      --card-bg: #ffffff;
      --border-color: #e0d8d8;
      --text-main: #2b2b2b;
      --text-muted: #666666;
      --success-bg: #f0fdf4;
      --success-border: #bbf7d0;
      --success-text: #166534;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #991b1b;
    }

    body.dark {
      --maroon-primary: #ff4d4d;
      --maroon-dark: #cc0000;
      --maroon-hover: #ff6666;
      --bg-light: #181212;
      --card-bg: #241c1c;
      --border-color: #3d3030;
      --text-main: #f5f2f2;
      --text-muted: #b3a6a6;
      --success-bg: #064e3b;
      --success-border: #047857;
      --success-text: #a7f3d0;
      --danger-bg: #7f1d1d;
      --danger-border: #b91c1c;
      --danger-text: #fecaca;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      padding: 2.5rem;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(128, 0, 0, 0.05);
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 0.5rem;
    }

    .topbar button {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .topbar button:hover {
      background: var(--bg-light);
    }

    /* HEADER TITLES */
    .company-tag {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--maroon-primary);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    h2 {
      text-align: center;
      margin: 0;
      color: var(--text-main);
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
      margin-bottom: 1.5rem;
    }

    /* FORM & INPUTS */
    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--text-main);
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0 0.85rem;
      font-size: 0.95rem;
      font-weight: 500;
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--maroon-primary);
      box-shadow: 0 0 0 3px rgba(128, 0, 0, 0.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 600px) {
      .row { grid-template-columns: 1fr; }
    }

    /* BUTTONS */
    .button-container {
      margin-top: 1.5rem;
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .action-button {
      flex: 1;
      min-width: 160px;
      height: 44px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      background: var(--maroon-primary);
      color: #ffffff;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .action-button:hover {
      background: var(--maroon-hover);
    }

    .action-button:active {
      transform: translateY(1px);
    }

    .action-button.secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .action-button.secondary:hover {
      background: var(--bg-light);
    }

    /* HASIL */
    #hasil {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .result-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.85rem 1.25rem;
      border-radius: 8px;
      background: var(--bg-light);
      border: 1px solid var(--border-color);
      font-size: 0.95rem;
    }

    .result-line strong {
      font-weight: 700;
      color: var(--maroon-primary);
    }

    /* FOOTER */
    .footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .footer a {
      color: var(--maroon-primary);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .insta-icon {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="topbar">
      <button onclick="toggleTheme()">🌙</button>
    </div>

    <!-- HEADER BRANDING -->
    <div class="company-tag">PT JADE KARYA TRINUSA</div>
    <h2>Kalkulator Penawaran Properti</h2>
    <div class="subtitle">Proyek: Zona Nilai Tanah Jatim II skala 1:10.000</div>

    <form id="calcForm" onsubmit="event.preventDefault(); hitung();">
      <div class="row">
        <div class="form-group">
          <label for="hargaPenawaran">Harga Penawaran (Rp)</label>
          <input type="text" id="hargaPenawaran" placeholder="Contoh: 500.000.000" oninput="formatInputRupiah(this)" required>
        </div>
        <div class="form-group">
          <label for="diskonMargin">Margin Negosiasi / Diskon (%)</label>
          <input type="number" id="diskonMargin" placeholder="Contoh: 10" step="0.1" value="10" required>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="luasTanah">Luas Tanah (m²)</label>
          <input type="number" id="luasTanah" placeholder="Contoh: 120" step="any">
        </div>
        <div class="form-group">
          <label for="luasBangunan">Luas Bangunan (m²)</label>
          <input type="number" id="luasBangunan" placeholder="Contoh: 70" step="any">
        </div>
      </div>

      <div class="button-container">
        <button type="button" class="action-button secondary" onclick="resetForm()">Reset</button>
        <button type="submit" class="action-button">Hitung Indikasi Nilai</button>
      </div>
    </form>

    <div id="hasil"></div>

    <!-- FOOTER -->
    <div class="footer">
      <span>&copy; PT Jade Karya Trinusa</span>
      <span>•</span>
      <a href="https://instagram.com/dheadeviana_" target="_blank">
        <svg class="insta-icon" viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1"/>
        </svg>
        @dheadeviana_
      </a>
      <span>•</span>
      <a href="https://instagram.com/hasanasdllh" target="_blank">
        <svg class="insta-icon" viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1"/>
        </svg>
        @hasanasdllh
      </a>
    </div>

  </div>

  <script>
    function formatInputRupiah(el) {
      let v = el.value.replace(/\D/g, '');
      el.value = v ? new Intl.NumberFormat('id-ID').format(v) : '';
    }

    function hitung() {
      const rawHarga = document.getElementById('hargaPenawaran').value.replace(/\./g, '');
      const harga = parseFloat(rawHarga);
      const diskonPercent = parseFloat(document.getElementById('diskonMargin').value) || 0;
      const lt = parseFloat(document.getElementById('luasTanah').value) || 0;
      const lb = parseFloat(document.getElementById('luasBangunan').value) || 0;

      const hasilDiv = document.getElementById('hasil');
      hasilDiv.innerHTML = '';

      if (isNaN(harga) || harga <= 0) {
        hasilDiv.innerHTML = `
          <div class="result-line" style="border-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-text);">
            <span>Error</span>
            <strong>Masukkan harga penawaran yang valid!</strong>
          </div>`;
        return;
      }

      const estimasiNilaiPasar = harga * (1 - (diskonPercent / 100));
      
      let htmlContent = `
        <div class="result-line">
          <span>Harga Penawaran Awali</span>
          <strong>Rp ${harga.toLocaleString('id-ID')}</strong>
        </div>
        <div class="result-line">
          <span>Indikasi Nilai Pasar (Diskon ${diskonPercent}%)</span>
          <strong>Rp ${Math.round(estimasiNilaiPasar).toLocaleString('id-ID')}</strong>
        </div>`;

      if (lt > 0) {
        const indikasiPerMeterTanah = estimasiNilaiPasar / lt;
        htmlContent += `
          <div class="result-line">
            <span>Indikasi Nilai / m² Tanah</span>
            <strong>Rp ${Math.round(indikasiPerMeterTanah).toLocaleString('id-ID')} / m²</strong>
          </div>`;
      }

      hasilDiv.innerHTML = htmlContent;
    }

    function resetForm() {
      document.getElementById('calcForm').reset();
      document.getElementById('hasil').innerHTML = '';
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
    }
  </script>
</body>
</html>
