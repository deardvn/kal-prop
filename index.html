<style>
/* ================= NEUMORPHISM VARIABLES (MAROON THEME) ================= */
:root{
  --bg:#e8ecef;
  --card-bg:#e8ecef;
  --text-color:#2b2b2b;

  --accent:#800000;
  --accent-hover:#5a0000;

  --danger:#d9534f;
  --danger-hover:#c9302c;

  --soft-shadow:
    8px 8px 16px #c4c8cb,
   -8px -8px 16px #ffffff;

  --inset-shadow:
    inset 5px 5px 10px #c4c8cb,
    inset -5px -5px 10px #ffffff;

  --success-bg:#800000;
  --success-text:#ffffff;

  --input-height:46px;
}

/* ================= DARK MODE ================= */
body.dark{
  --bg:#1a1818;
  --card-bg:#1a1818;
  --text-color:#e5e5e5;

  --accent:#ff6b6b;
  --accent-hover:#ff8787;

  --danger:#ff5252;
  --danger-hover:#e03131;

  --soft-shadow:
    8px 8px 16px #111010,
   -8px -8px 16px #232020;

  --inset-shadow:
    inset 5px 5px 10px #111010,
    inset -5px -5px 10px #232020;

  --success-bg:#a00000;
  --success-text:#ffffff;
}

/* ================= BASE ================= */
body{
  margin:0;
  font-family:Segoe UI,Tahoma,sans-serif;
  background:var(--bg);
  color:var(--text-color);
}

.container{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:1rem;
  box-sizing:border-box;
}

/* ================= HEADER ================= */
.header-wrapper{
  background:var(--card-bg);
  padding:1.5rem;
  border-radius:24px;
  box-shadow:var(--soft-shadow);
  text-align:center;
  position:relative;
  margin-bottom:2rem;
}

.company-title{
  color:var(--accent);
  font-weight:bold;
  letter-spacing:1px;
  font-size:0.9rem;
  margin-bottom:0.3rem;
  text-transform:uppercase;
}

.topbar{
  position:absolute;
  top:1rem;
  right:1rem;
}

#darkModeToggle{
  background:var(--card-bg);
  border:none;
  width:42px;
  height:42px;
  border-radius:50%;
  box-shadow:var(--soft-shadow);
  cursor:pointer;
  font-size:1.1rem;
}

/* ================= FORM CONTAINER ================= */
#formContainer{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  gap:1.5rem;
  width:100%;
}

#formContainer:has(.sampel:nth-child(2)){
  display:grid;
  grid-template-columns:1fr;
  justify-content:stretch;
  align-items:start;
}

/* ================= CARD ================= */
.sampel,
.result{
  background:var(--card-bg);
  padding:1.5rem;
  border-radius:24px;
  box-shadow:var(--soft-shadow);
  position:relative;
  width:100%;
  max-width:100%;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  height:100%;
}

.sampel h3,
.result h4{
  margin-top:0;
  color:var(--accent);
}

/* ================= FORM ================= */
label{
  font-size:.85rem;
  font-weight:600;
  margin-top:1rem;
  margin-bottom:.2rem;
  display:block;
}

input,
select{
  width:100%;
  height:var(--input-height);
  padding:0 .9rem;
  border:none;
  border-radius:14px;
  background:var(--card-bg);
  box-shadow:var(--inset-shadow);
  color:var(--text-color);
  font-size:.95rem;
  box-sizing:border-box;
  appearance:none;
}

input:focus,
select:focus{
  outline:none;
  background-color:var(--card-bg) !important;
}

input[type="text"],
input[type="number"],
select{
  background-color:var(--card-bg) !important;
  color:var(--text-color);
}

/* Chrome autofill override */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active{
  -webkit-box-shadow:0 0 0 1000px var(--card-bg) inset !important;
  -webkit-text-fill-color:var(--text-color) !important;
  transition:background-color 5000s ease-in-out 0s;
  border-radius:14px;
}

/* ================= BUTTON ================= */
.button-container{
  margin:2rem 0;
  padding:1.5rem;
  border-radius:24px;
  box-shadow:var(--soft-shadow);
  display:flex;
  flex-direction:column;
  gap:1rem;
  align-items:center;
}

button.main-btn{
  width:100%;
  max-width:280px;
  height:48px;
  border:none;
  border-radius:18px;
  background:var(--card-bg);
  color:var(--accent);
  font-weight:bold;
  box-shadow:var(--soft-shadow);
  cursor:pointer;
}

button.main-btn:hover{
  box-shadow:var(--inset-shadow);
}

button.btn-hitung{
  background:var(--accent);
  color:#ffffff;
}

button.btn-hitung:hover{
  background:var(--accent-hover);
}

/* ================= DELETE ================= */
.btn-delete{
  position:absolute;
  top:1rem;
  right:1rem;
  background:var(--card-bg);
  color:var(--danger);
  border:none;
  padding:.4rem .9rem;
  border-radius:14px;
  box-shadow:var(--soft-shadow);
  cursor:pointer;
  font-weight:600;
}

/* ================= RESULT ================= */
#output{
  display:grid;
  grid-template-columns:1fr;
  gap:1.5rem;
  align-items:stretch;
  width:100%;
}

.result-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
  margin-bottom:0.4rem;
}

.result-line strong{
  white-space:nowrap;
  text-align:right;
  flex-shrink:0;
}

.result-final{
  margin-top:auto;
  padding:1rem;
  border-radius:18px;
  background:var(--success-bg);
  color:var(--success-text);
  box-shadow:var(--soft-shadow);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:.4rem;
  text-align:center;
}

.result-final .value{
  font-size:1.4rem;
  font-weight:bold;
  white-space:nowrap;
  font-variant-numeric: tabular-nums;
}

/* ================= FOOTER ================= */
.footer{
  text-align:center;
  margin-top:3rem;
  margin-bottom:2rem;
  display:flex;
  justify-content:center;
}

.insta-btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:0.9rem 1.6rem;
  background:var(--card-bg);
  color:var(--text-color);
  text-decoration:none;
  font-weight:600;
  font-size:0.95rem;
  border-radius:50px;
  box-shadow:var(--soft-shadow);
  transition:all 0.2s ease-in-out;
}

.insta-btn:hover{
  box-shadow:var(--inset-shadow);
  color:var(--accent);
  transform:translateY(2px);
}

.insta-btn svg{
  width:20px;
  height:20px;
  fill:currentColor;

/* ================= RESPONSIVE ================= */
@media (min-width:768px){
  .sampel,
  .result{

  #formContainer:has(.sampel:nth-child(2)){

  }

  #output{
    grid-template-columns:repeat(2,1fr);
  }

  .button-container{
    flex-direction:row;
    justify-content:center;
  }

@media (min-width:1200px){
  #formContainer{
    max-width:1100px;
    margin-left:auto;
    margin-right:auto;
  }

    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}
</style>

/* ——— Utility ——— */
function formatRupiah(el){
  let v=el.value.replace(/\D/g,'');
  el.value=v?new Intl.NumberFormat('id-ID').format(v):'';
}
function formatMoney(num) {
  return "Rp " + Math.round(num).toLocaleString('id-ID');
}
function formatPct(num) {
  return "(" + (num * 100).toFixed(2) + "%)";
}

let counterSampel=0;

/* ——— Tambah Sampel ——— */
function tambahSampel(){
  counterSampel++;
  const c=document.getElementById("formContainer");
  const d=document.createElement("div");
  d.className="sampel";
  d.id="sampel"+counterSampel;
  d.innerHTML=`
    <button class="btn-delete" onclick="hapusSampel(${counterSampel})">Hapus</button>
    <h3>Rencana Sampel ${counterSampel}</h3>

    <label>Nilai Tanah per m² (Rp)</label>
    <input type="text" id="targetNilai${counterSampel}" oninput="formatRupiah(this)" placeholder="cth: 5.000.000">

    <label>Jenis Properti</label>
    <select id="jenisProperti${counterSampel}" onchange="toggleInput(${counterSampel})">
      <option value="rumah">Rumah</option>
      <option value="ruko">Ruko</option>

/* ——— Helper ——— */
function hapusSampel(id){
  const el=document.getElementById("sampel"+id);
  if(el) el.remove();
  hitungMulti();
}

function toggleInput(i){
  const jenis=document.getElementById("jenisProperti"+i).value;
  const div=document.getElementById("inputBangunan"+i);
  if(div) div.style.display=jenis==="lahan"?"none":"block";
}

/* ===== LOGIKA PEMBALIKAN PERHITUNGAN ===== */
function hitungMulti(){
  document.activeElement?.blur();
  let out=document.getElementById("output");
  out.innerHTML="";

  for(let i=1;i<=counterSampel;i++){
    if(!document.getElementById("sampel"+i)) continue;

    const targetNilai = parseFloat(document.getElementById("targetNilai"+i).value.replace(/\./g,''))||0;
    const luasTanah = parseFloat(document.getElementById("luasTanah"+i).value)||0;

    if(!targetNilai || !luasTanah){
      out.innerHTML+=`<div class="result"><h4>Hasil Sampel ${i}</h4><p style="color:var(--danger)">Harap isi Target Nilai Tanah dan Luas Tanah!</p></div>`;
      continue;
    }

    const hasil=prosesHitungBalik(
      targetNilai,
      document.getElementById("jenisProperti"+i).value,
      document.getElementById("status"+i).value,
      document.getElementById("jenis"+i).value,
      new Date(document.getElementById("tanggal"+i).value),
      luasTanah,
      document.getElementById("luasBangunan"+i)?.value,
      document.getElementById("tahunPembuatan"+i)?.value,
      document.getElementById("tahunRenovasi"+i)?.value,
      document.getElementById("kondisi"+i)?.value,
      document.getElementById("biaya"+i)?.value
    );

    out.innerHTML+=`<div class="result"><h4>Target Harga Sampel ${i}</h4>${hasil}</div>`;
  }
}

// OUTPUT DETAIL DENGAN LOGIKA REVERSE
function prosesHitungBalik(targetNilaiPerM2,jenisProperti,status,jenis,tanggal,luasTanah,luasBangunan,tahunPembuatan,tahunRenovasi,kondisi,biaya){

  // 1. Hitung Faktor Penyesuaian
  let faktorStatus = (status==="TMA")?0.10:(status==="HGB"||status==="HP")?0.05:0;
  let akhir = new Date("2026-12-31");
  let tahunSelisih = (akhir - tanggal)/(1000*60*60*24*365);
  let persenWaktu = 0.10 * tahunSelisih;
  let faktorTotal = 1 + persenWaktu + faktorStatus;

  // 2. Kembalikan Nilai Total Tanah Adjusted ke Indikasi Harga Tanah Awal
  let totalNilaiTanahAdj = targetNilaiPerM2 * luasTanah;
  let indikasiHargaTanah = totalNilaiTanahAdj / faktorTotal;

  let nilaiWaktu = indikasiHargaTanah * persenWaktu;
  let nilaiStatus = indikasiHargaTanah * faktorStatus;

  // --- SKENARIO LAHAN KOSONG ---
  if(jenisProperti === "lahan"){
    let hargaPenyesuaian = indikasiHargaTanah;
    let hargaListing = (jenis === "Penawaran") ? (hargaPenyesuaian / 0.9) : hargaPenyesuaian;
    let hargaListingPerM2 = hargaListing / luasTanah;

    return `
      <div class="result-line"><span>Target Nilai Akhir / m²</span><strong>${formatMoney(targetNilaiPerM2)}</strong></div>
      <div class="result-line"><span>Total Target Tanah (Adjusted)</span><strong>${formatMoney(totalNilaiTanahAdj)}</strong></div>
      <div class="result-line"><span>Faktor Waktu ${formatPct(persenWaktu)}</span><strong>-${formatMoney(nilaiWaktu)}</strong></div>
      <div class="result-line"><span>Faktor Status ${formatPct(faktorStatus)}</span><strong>-${formatMoney(nilaiStatus)}</strong></div>
      <div class="result-line"><span>Harga Setelah Diskon (90%)</span><strong>${formatMoney(hargaPenyesuaian)}</strong></div>
      <div class="result-line"><span>Harga Listing per m²</span><strong>${formatMoney(hargaListingPerM2)}</strong></div>
      <div class="result-final">
        <div>Harga Yang Harus Dimasukkan</div>
        <div class="value">${formatMoney(hargaListing)}</div>
      </div>
    `;
  }

  // --- SKENARIO BANGUNAN (Rumah/Ruko) ---
  biaya = parseFloat((biaya||"0").toString().replace(/\./g,''))||0;
  luasBangunan = parseFloat(luasBangunan)||0;
  tahunPembuatan = parseInt(tahunPembuatan)||2026;
  tahunRenovasi = parseInt(tahunRenovasi)||0;

  const tahunPenilaian = 2026;
  const NPBB = luasBangunan * biaya;

  // Umur Efektif
  let umurEfektif = tahunPenilaian - tahunPembuatan;
  if(tahunRenovasi > tahunPembuatan){
    umurEfektif = ((tahunPenilaian - tahunPembuatan) + 2 * (tahunPenilaian - tahunRenovasi)) / 3;
  }
  umurEfektif = Math.ceil(Math.max(0, Math.min(50, umurEfektif)));

  // Kategori & Persen Susut
  let kategori = (jenisProperti === "rumah")
    ? (biaya > 2000000 ? "high" : "low")
    : (biaya > 3000000 ? "high" : "low");

  const persen = tabelPenyusutan[jenisProperti][kategori][kondisi]?.[umurEfektif] || 0;

  // Nilai Bangunan
  const penyusutan = NPBB * (persen / 100);
  const nilaiBangunan = NPBB - penyusutan;

  // Nilai Total Real / Penyesuaian = Indikasi Tanah + Bangunan
  let hargaPenyesuaian = indikasiHargaTanah + nilaiBangunan;

  // Kembalikan ke Harga Awal / Penawaran (Sebelum diskon 10%)
  let hargaListing = (jenis === "Penawaran") ? (hargaPenyesuaian / 0.9) : hargaPenyesuaian;

  return `
    <div class="result-line"><span>Target Nilai Akhir / m²</span><strong>${formatMoney(targetNilaiPerM2)}</strong></div>
    <div class="result-line"><span>Total Target Tanah (Adjusted)</span><strong>${formatMoney(totalNilaiTanahAdj)}</strong></div>
    <div class="result-line"><span>Indikasi Harga Tanah Murni</span><strong>${formatMoney(indikasiHargaTanah)}</strong></div>
    <div class="result-line"><span>Umur Efektif Bangunan</span><strong>${umurEfektif} th (${persen}%)</strong></div>
    <div class="result-line"><span>Nilai Sisa Bangunan</span><strong>+${formatMoney(nilaiBangunan)}</strong></div>
    <div class="result-line"><span>Total Nilai Objek (Netto)</span><strong>${formatMoney(hargaPenyesuaian)}</strong></div>
    <div class="result-final">
      <div>Harga Yang Harus Dimasukkan</div>
      <div class="value">${formatMoney(hargaListing)}</div>
    </div>
  `;
}

/* ——— Dark Mode ——— */
function toggleDarkMode(){
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode",document.body.classList.contains("dark"));
}

(function(){
  if(localStorage.getItem("darkMode")==="true"){
    document.body.classList.add("dark");
  }
  tambahSampel();
})();
</script>
